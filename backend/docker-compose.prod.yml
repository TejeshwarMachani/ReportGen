version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_user", "-d", "app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ulimits:
      nproc: 65535
      nofile: 100000

  # Redis for rate limiting and Celery
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ulimits:
      nproc: 65535
      nofile: 100000

  # MinIO - S3-compatible object storage for file uploads
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ulimits:
      nproc: 65535
      nofile: 100000

  # FastAPI Backend Application
  backend:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-app_password}@postgres:5432/app_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: reports-bucket
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DEBUG: "False"
      ALLOWED_HOSTS: "api.example.com,app.example.com"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app

  # Celery Worker for background tasks (forecasts, report generation)
  celery-worker:
    build: .
    command: celery -A app.core.celery_app:celery worker --loglevel=info --concurrency 8
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-app_password}@postgres:5432/app_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: reports-bucket
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app

  # Celery Beat for scheduled tasks (scheduled reports)
  celery-beat:
    build: .
    command: celery -A app.core.celery_app:celery beat --loglevel=info
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-app_password}@postgres:5432/app_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app

  # Traefik - Reverse proxy with TLS and security headers
  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/traefik.yml:ro"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: